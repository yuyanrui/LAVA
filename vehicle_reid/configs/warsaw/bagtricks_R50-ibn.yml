_BASE_: ../Base-bagtricks.yml

INPUT:
  SIZE_TRAIN: [256, 256]
  SIZE_TEST: [256, 256]

MODEL:
  BACKBONE:
    WITH_IBN: True
    PRETRAIN_PATH: vehicle_reid/pretrained/veriwild_bot_R50-ibn.pth
    
  HEADS:
    POOL_LAYER: GeneralizedMeanPooling
    # NUM_CLASSES: 1

  LOSSES:
    NAME: ("CrossEntropyLoss", "TripletLoss")

    TRI:
      HARD_MINING: False
      MARGIN: 0.0
      SCALE: 10.0

  WEIGHTS: vehicle_reid/logs/warsaw_history/bagtricks_R50-ibn/model_final.pth
    # MCE:
    #   SCALE: 10.0

DATASETS:
  NAMES: ("Warsaw",)
  TESTS: ("Warsaw",)

DATALOADER:
  SAMPLER_TRAIN: NaiveIdentitySampler
  NUM_INSTANCE: 8
  NUM_WORKERS: 8

SOLVER:
  IMS_PER_BATCH: 128 # 512 For 4 GPUs
  MAX_EPOCH: 120
  STEPS: [30, 70, 90]
  WARMUP_ITERS: 5000

  CHECKPOINT_PERIOD: 10

TEST:
  EVAL_PERIOD: 20
  IMS_PER_BATCH: 256

OUTPUT_DIR: vehicle_reid/logs/warsaw/bagtricks_R50-ibn
